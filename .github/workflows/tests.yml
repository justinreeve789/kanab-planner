name: tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kanab_test
          MYSQL_USER: kanab
          MYSQL_PASSWORD: kanab
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: kanab
      DB_PASSWORD: kanab
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, intl, gd, zip, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Grant the test user access to the dataset schema
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE kanab_data; GRANT ALL ON kanab_data.* TO 'kanab'@'%';"
      - name: Load database/dumps into kanab_data
        run: tests/Data/load-dumps.sh
      - run: vendor/bin/phpunit

  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm run docs:build
